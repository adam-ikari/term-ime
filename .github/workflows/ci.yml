name: Build and Test

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          pkg-config
      # yaml-cpp/leveldb/marisa/opencc build from vendored source as static
      # archives. Boost is fully removed (librime uses std::regex + <rime/*.hpp>
      # shims; only boost/sml.hpp remains, from the bundled deps/sml submodule).
      # The binary links -static (zero runtime shared libs).

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release -j$(nproc)

    - name: Run tests
      run: |
        cd build
        ctest --output-on-failure
        # Run additional non-gtest test binaries
        echo ">> Running test-input-e2e"
        ./test-input-e2e
        echo ">> Running test-ui-jsx"
        ./test-ui-jsx
        echo ">> Running test-settings"
        ./test-settings

  e2e:
    # Python PTY end-to-end layer: drives the REAL binary through a pseudo-
    # terminal (input state machine, settings panel, per-group fuzzy toggles,
    # simplified-candidate guarantee). Needs a TTY-capable runner — the GitHub
    # ubuntu runner has a working /dev/ptmx, so no extra deps beyond python3.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake pkg-config

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release -j$(nproc)

    - name: Run python e2e tests
      run: |
        set -o pipefail
        echo ">> test_settings_panel_e2e"
        python3 tests/test_settings_panel_e2e.py
        echo ">> test_settings_e2e"
        python3 tests/test_settings_e2e.py
        echo ">> test_e2e"
        python3 tests/test_e2e.py
        echo ">> test_simplified_candidates"
        python3 tests/test_simplified_candidates.py
        echo ">> test_fuzzy_pinyin (per-group toggles)"
        python3 tests/test_fuzzy_pinyin.py
        echo ">> test_punctuation"
        python3 tests/test_punctuation.py

  website:
    # The docs are user-facing: a broken build (bad mdx, broken links) must
    # fail CI, not silently rot the published site.
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: website/package-lock.json

    - name: Build website
      working-directory: website
      run: |
        npm ci
        npm run build

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install clang-format
      run: sudo apt-get install -y clang-format

    - name: Check formatting
      run: |
        find src -name "*.cpp" -o -name "*.hpp" | xargs clang-format --dry-run --Werror
      continue-on-error: true

  android-build:
    # Termux target. term-ime is a TUI program built on forkpty/termios, so
    # this job exists to prove the CROSS-COMPILE keeps working: the Android
    # binary must configure, compile and link without a device in the loop.
    #
    # What this does NOT cover: running it under Termux. PTY, TIOCGWINSZ and
    # SIGWINCH behaviour on a real phone is unverified here, so read this as
    # "still builds for arm64 Android", not "works on a phone".
    # API 28 is the floor: bionic only gained posix_spawn (libuv's process.c
    # needs it) at API 28.
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install NDK
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build
        # r27 is what this was developed against; a newer r28+ should also work.
        # The zip's top-level dir is `android-ndk-r27` (NO version suffix), so
        # do not assume a directory name -- discover it from the toolchain file.
        # --http1.1: dl.google.com resets the HTTP/2 stream on this 664MB body.
        curl -fsSL --http1.1 -o /tmp/ndk.zip \
          "https://dl.google.com/android/repository/android-ndk-r27-linux.zip"
        sudo unzip -q /tmp/ndk.zip -d /opt/ndk
        # GitHub runners already export ANDROID_NDK_ROOT for their own NDK;
        # appending to it would produce a path that does not exist.
        # <ndk>/build/cmake/android.toolchain.cmake -> three dirnames back up.
        NDK="$(find /opt/ndk -name android.toolchain.cmake -path '*/build/cmake/*' -print -quit \
              | xargs dirname | xargs dirname | xargs dirname)"
        test -f "${NDK}/build/cmake/android.toolchain.cmake" \
          || { echo "could not locate an NDK toolchain under /opt/ndk (got '${NDK}')"; exit 1; }
        echo "ANDROID_NDK=${NDK}" >> "$GITHUB_ENV"

    - name: Cross-compile for arm64-v8a (API 28)
      run: |
        cmake -B build-android -G Ninja \
          -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK}/build/cmake/android.toolchain.cmake" \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-28 \
          -DCMAKE_BUILD_TYPE=Release
        cmake --build build-android -j$(nproc) --target term-ime

    - name: Verify the Android binary
      run: |
        BIN=build-android/term-ime
        BINUTILS="${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin"
        test -x "$BIN" || { echo "no binary produced"; exit 1; }
        file "$BIN"
        # Must be an ARM64 Android ELF using the platform loader...
        file "$BIN" | grep -q "ARM aarch64" || { echo "not aarch64"; exit 1; }
        file "$BIN" | grep -q "/system/bin/linker64" || { echo "not an Android binary"; exit 1; }
        # ...and must NOT be static: a -static bionic link is not loadable by
        # Android, which is exactly the regression worth failing on.
        if file "$BIN" | grep -q "statically linked"; then
          echo "ERROR: Android binary is statically linked; the platform loader rejects that"
          exit 1
        fi
        # Only platform libraries may be needed -- no glibc, no host leftovers.
        "${BINUTILS}/llvm-readelf" -d "$BIN" | grep NEEDED
        readelf -d "$BIN" | grep NEEDED | sed 's/.*\[\(.*\)\]/\1/' | while read -r lib; do
          case "$lib" in
            libc.so|libm.so|libdl.so|liblog.so) ;;
            *) echo "ERROR: unexpected runtime dep: $lib"; exit 1 ;;
          esac
        done
        # forkpty is what makes a TUI-in-a-PTY possible on Android at all.
        "${BINUTILS}/llvm-nm" -D "$BIN" | grep -q "forkpty@LIBC" \
          || { echo "ERROR: forkpty not bound against bionic's libc"; exit 1; }
        echo "OK: aarch64 Android binary, platform libs only, forkpty resolved"

  install-test:
    # End-to-end check of the one-line installer (curl | bash). Rebuilds the
    # release tarball locally (same layout as release.yml), serves it over a
    # throwaway HTTP server, then pipes it through website/static/install.sh
    # via TERM_IME_DOWNLOAD_BASE and asserts the installed `ti` binary works.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake pkg-config

    - name: Configure & build
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build --config Release -j$(nproc)

    - name: Pack release tarball (mirror release.yml)
      run: |
        mkdir -p dist/term-ime/bin
        mkdir -p dist/term-ime/share/term-ime/rime-data
        mkdir -p dist/term-ime/share/term-ime/translations
        cp build/term-ime dist/term-ime/bin/ti
        ln -sf ti dist/term-ime/bin/term-ime
        cp -r build/share/rime-data/* dist/term-ime/share/term-ime/rime-data/
        cp data/translations/*.json dist/term-ime/share/term-ime/translations/
        cp README.md dist/term-ime/
        tar -czf term-ime-linux-x86_64.tar.gz -C dist term-ime
        sha256sum term-ime-linux-x86_64.tar.gz > term-ime-linux-x86_64.tar.gz.sha256

    - name: Run installer and verify binary
      run: |
        set -euo pipefail
        python3 -m http.server 8899 --directory . >/tmp/httpserver.log 2>&1 &
        SERVER_PID=$!
        trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
        sleep 1

        PREFIX="$(mktemp -d)/ime"
        TERM_IME_DOWNLOAD_BASE="http://127.0.0.1:8899" \
          bash website/static/install.sh --version v9.9.9 --prefix "$PREFIX" \
          | tee /tmp/install.log
        grep -q "Installed rime-data" /tmp/install.log
        grep -q "Installed translations" /tmp/install.log

        test -x "$PREFIX/bin/ti"
        test -L "$PREFIX/bin/term-ime"
        test "$(readlink "$PREFIX/bin/term-ime")" = "ti"

        # The real TUI needs a PTY (already covered by the `e2e` job, which
        # drives the freshly-built binary). Here we assert the installer's
        # hand-off is sound: binary placed, alias symlinked, data installed,
        # statically linked, and the script is syntactically clean.
        bash -n website/static/install.sh
        file "$PREFIX/bin/ti" | grep -q "statically linked"
        test -s "$PREFIX/bin/term-ime"
        test -f "$PREFIX/share/term-ime/rime-data/essay.txt"
        test -f "$PREFIX/share/term-ime/translations/zh-CN.json"
        echo "OK: install-test passed"

    - name: Installer picks the Termux asset (simulated phone)
      # The installer must branch on Termux without a phone: on Android the
      # asset is `term-ime-termux-arm64`, the prefix defaults to Termux's own
      # $PREFIX/bin (already on PATH), and the "statically linked" check must NOT
      # fire -- the Android build is deliberately dynamic. Two of those three
      # regress easily and silently, so pin them here.
      #
      # This hits the real GitHub releases (the termux asset only exists there).
      # The no---version case additionally asserts the installer never calls the
      # GitHub API, so it cannot be broken by (or break on) API rate limiting.
      #
      # `uname -m` is stubbed because the runner is x86_64 while every phone is
      # aarch64 -- the same trap the real Termux check exists to avoid.
      run: |
        set -euo pipefail
        STUB="$(mktemp -d)"
        cat > "$STUB/uname" <<'EOF'
        #!/bin/sh
        [ "$1" = "-m" ] && { echo aarch64; exit 0; }
        exec /usr/bin/uname "$@"
        EOF
        chmod +x "$STUB/uname"

        TERMUX_PREFIX="$(mktemp -d)/usr"
        PATH="$STUB:$PATH" TERMUX_VERSION=0.118 TERMUX_PREFIX="$TERMUX_PREFIX" \
          bash website/static/install.sh \
            --version v1.1.7-termux \
            --prefix "$TERMUX_PREFIX" | tee /tmp/install-termux.log

        test -x "$TERMUX_PREFIX/bin/ti"
        test -L "$TERMUX_PREFIX/bin/term-ime"
        file "$TERMUX_PREFIX/bin/ti" | grep -q "ARM aarch64"
        # Must be the Android build, not the glibc one.
        file "$TERMUX_PREFIX/bin/ti" | grep -q "linker64"
        test -f "$TERMUX_PREFIX/share/term-ime/rime-data/essay.txt"
        # The dynamic-link warning must stay quiet for a correct Termux install.
        ! grep -q "WARNING" /tmp/install-termux.log

        # No --version: the installer must still resolve the Termux build on its
        # own, WITHOUT touching the GitHub API. That matters because the
        # unauthenticated API allows only 60 req/hour per IP -- a discovery
        # approach that lists releases and probes assets burns that quota and
        # then fails every install with a bare 403. Assert the API is unused.
        AUTO="$(mktemp -d)/usr"
        NOAPI="$(mktemp -d)"
        cat > "$NOAPI/curl" <<'STUB'
        #!/bin/sh
        for a in "$@"; do
          case "$a" in *api.github.com*) echo "api.github.com must not be used" >&2; exit 7;; esac
        done
        exec /usr/bin/curl "$@"
        STUB
        chmod +x "$NOAPI/curl"
        PATH="$NOAPI:$STUB:$PATH" TERMUX_VERSION=0.118 TERMUX_PREFIX="$AUTO" \
          bash website/static/install.sh --prefix "$AUTO" > /tmp/install-auto.log 2>&1
        grep -q "Termux build: v1.1.7-termux" /tmp/install-auto.log
        test -x "$AUTO/bin/ti"
        file "$AUTO/bin/ti" | grep -q "linker64"
        ! grep -q "WARNING" /tmp/install-auto.log
        echo "OK: install-termux-test passed"

    - name: Installer's Termux tag default stays rewritable
      # release.yml pins the Termux tag by rewriting
      # `TERM_IME_TERMUX_TAG:-<tag>` with sed. If that default is renamed or
      # reformatted, the release job's own grep fails -- but only once a tag is
      # pushed, by which time the release is half-published. This catches it on
      # every push instead.
      run: |
        set -euo pipefail
        SH=website/static/install.sh
        grep -q 'TERM_IME_TERMUX_TAG:-v[0-9]' "$SH" || {
          echo "::error::$SH lost its 'TERM_IME_TERMUX_TAG:-v<n>' default;"
          echo "release.yml rewrites it with sed, so a rename breaks tagging silently"
          exit 1; }
        # The rewrite must produce something the later assertion can match.
        cp "$SH" /tmp/inst_probe.sh
        sed -i -E 's|(TERM_IME_TERMUX_TAG:-)v[^}]+|\1v9.9.9-termux|' /tmp/inst_probe.sh
        grep -q 'TERM_IME_TERMUX_TAG:-v9.9.9-termux' /tmp/inst_probe.sh || {
          echo "::error::the sed in release.yml would not take effect"; exit 1; }
        bash -n /tmp/inst_probe.sh
        echo "OK: Termux tag default is rewritable"

    - name: Installer works on a bare Termux bootstrap
      # A fresh Termux has no curl and no wget -- its bootstrap is
      # bash/coreutils/dash/diffutils/findutils/gawk/grep/gzip/less/procps/
      # psmisc/sed/tar/termux-*/util-linux/xz-utils. The documented one-liner
      # is `curl ... | bash`, so it must not be the ONLY thing a phone can run:
      # wget has to work as a substitute, and with neither one the failure must
      # name `pkg install curl` instead of dying on "command not found" from
      # inside a pipeline.
      #
      # `file` is absent too, which used to make every correct phone install end
      # in two bogus "binary is not aarch64" warnings -- the check could not run,
      # not the binary being wrong.
      run: |
        set -euo pipefail
        STAGE="$(mktemp -d)"
        mkdir -p "$STAGE/term-ime/bin" \
                 "$STAGE/term-ime/share/term-ime/rime-data" \
                 "$STAGE/term-ime/share/term-ime/translations"
        cp build/term-ime "$STAGE/term-ime/bin/ti"
        cp build/share/rime-data/essay.txt "$STAGE/term-ime/share/term-ime/rime-data/"
        cp data/translations/zh-CN.json "$STAGE/term-ime/share/term-ime/translations/"
        (cd "$STAGE" && tar -czf term-ime-termux-arm64.tar.gz term-ime)
        (cd "$STAGE" && sha256sum term-ime-termux-arm64.tar.gz > term-ime-termux-arm64.tar.gz.sha256)
        python3 -m http.server 8897 --directory "$STAGE" >/dev/null 2>&1 &
        SRV=$!
        trap 'kill $SRV 2>/dev/null || true' EXIT
        sleep 1

        # A PATH with the bootstrap's tools but no curl, no wget, no file.
        BARE="$(mktemp -d)"
        for t in bash sh env sed grep cat uname mktemp tar gzip gunzip install ln \
                 sha256sum find ls dirname rm cp head mkdir readlink chmod basename; do
          p="$(command -v "$t" 2>/dev/null || true)"
          [ -n "$p" ] && ln -sf "$p" "$BARE/$t"
        done
        # uname -m must report aarch64 or the arch check rejects the run.
        rm -f "$BARE/uname"
        printf '#!/bin/sh\n[ "$1" = "-m" ] && echo aarch64 || exec /usr/bin/uname "$@"\n' > "$BARE/uname"
        chmod +x "$BARE/uname"
        ! PATH="$BARE" command -v curl >/dev/null 2>&1
        ! PATH="$BARE" command -v wget >/dev/null 2>&1
        ! PATH="$BARE" command -v file  >/dev/null 2>&1

        # 1. Neither HTTP client -> tell the user the one command they need.
        if PATH="$BARE" TERMUX_VERSION=0.118 TERM_IME_DOWNLOAD_BASE="http://127.0.0.1:8897" \
             bash website/static/install.sh --prefix "$(mktemp -d)/ime" >/tmp/bare-none.log 2>&1; then
          echo "ERROR: installer ran with no HTTP client at all"; exit 1
        fi
        grep -q "pkg install curl" /tmp/bare-none.log
        ! grep -q "command not found" /tmp/bare-none.log

        # 2. wget only -> the whole install must still work.
        ln -sf "$(command -v wget)" "$BARE/wget"
        WP="$(mktemp -d)/ime"
        PATH="$BARE" TERMUX_VERSION=0.118 TERM_IME_DOWNLOAD_BASE="http://127.0.0.1:8897" \
          bash website/static/install.sh --prefix "$WP" 2>&1 | tee /tmp/bare-wget.log
        test -x "$WP/bin/ti"
        grep -q "Verifying checksum" /tmp/bare-wget.log
        grep -q "Installed rime-data" /tmp/bare-wget.log
        # No `file` means the check is skipped, never reported as a failure.
        grep -q "skipping the platform check" /tmp/bare-wget.log
        ! grep -q "WARNING" /tmp/bare-wget.log
        echo "OK: install-bare-termux-test passed"

    - name: Installer refuses to skip checksum on network errors
      # A flaky TLS read used to be indistinguishable from "no sidecar
      # published", silently downgrading an integrity check to nothing. Only a
      # genuine 404 may skip; any other fetch failure must abort the install.
      run: |
        set -euo pipefail
        STAGE="$(mktemp -d)"
        mkdir -p "$STAGE/term-ime/bin"
        cp build/term-ime "$STAGE/term-ime/bin/ti"
        (cd "$STAGE" && tar -czf term-ime-linux-x86_64.tar.gz term-ime)
        # deliberately NO .sha256 sidecar for the flaky case, and a 404 one
        # for the "not published" case
        python3 -m http.server 8896 --directory "$STAGE" >/dev/null 2>&1 &
        SRV=$!
        trap 'kill $SRV 2>/dev/null || true' EXIT
        sleep 1

        CURLSTUB="$(mktemp -d)"
        cat > "$CURLSTUB/curl" <<'STUB'
        #!/bin/sh
        for a in "$@"; do
          case "$a" in *.sha256) echo "curl: (35) TLS EOF" >&2; exit 35;; esac
        done
        exec /usr/bin/curl "$@"
        STUB
        chmod +x "$CURLSTUB/curl"

        # Network error -> refuse, and install nothing.
        P="$(mktemp -d)/ime"
        if PATH="$CURLSTUB:$PATH" TERM_IME_DOWNLOAD_BASE="http://127.0.0.1:8896" \
             bash website/static/install.sh --version v1 --prefix "$P" 2>/tmp/sha-net.log; then
          echo "ERROR: installer continued past a checksum fetch failure"
          exit 1
        fi
        grep -q "Refusing to install unverified" /tmp/sha-net.log
        test ! -f "$P/bin/ti" || { echo "ERROR: binary installed without verification"; exit 1; }

        # The documented escape hatch still works.
        P2="$(mktemp -d)/ime"
        PATH="$CURLSTUB:$PATH" TERM_IME_ALLOW_UNVERIFIED=1 \
          TERM_IME_DOWNLOAD_BASE="http://127.0.0.1:8896" \
          bash website/static/install.sh --version v1 --prefix "$P2" >/tmp/sha-skip.log 2>&1
        test -x "$P2/bin/ti"
        echo "OK: install-checksum-test passed"
