name: Build and Test

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          pkg-config
      # yaml-cpp/leveldb/marisa/opencc build from vendored source as static
      # archives. Boost is fully removed (librime uses std::regex + <rime/*.hpp>
      # shims; only boost/sml.hpp remains, from the bundled deps/sml submodule).
      # The binary links -static (zero runtime shared libs).

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release -j$(nproc)

    - name: Run tests
      run: |
        cd build
        ctest --output-on-failure
        # Run additional non-gtest test binaries
        echo ">> Running test-input-e2e"
        ./test-input-e2e
        echo ">> Running test-ui-jsx"
        ./test-ui-jsx
        echo ">> Running test-settings"
        ./test-settings

  e2e:
    # Python PTY end-to-end layer: drives the REAL binary through a pseudo-
    # terminal (input state machine, settings panel, per-group fuzzy toggles,
    # simplified-candidate guarantee). Needs a TTY-capable runner — the GitHub
    # ubuntu runner has a working /dev/ptmx, so no extra deps beyond python3.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake pkg-config

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release -j$(nproc)

    - name: Run python e2e tests
      run: |
        set -o pipefail
        echo ">> test_settings_panel_e2e"
        python3 tests/test_settings_panel_e2e.py
        echo ">> test_settings_e2e"
        python3 tests/test_settings_e2e.py
        echo ">> test_e2e"
        python3 tests/test_e2e.py
        echo ">> test_simplified_candidates"
        python3 tests/test_simplified_candidates.py
        echo ">> test_fuzzy_pinyin (per-group toggles)"
        python3 tests/test_fuzzy_pinyin.py
        echo ">> test_punctuation"
        python3 tests/test_punctuation.py

  website:
    # The docs are user-facing: a broken build (bad mdx, broken links) must
    # fail CI, not silently rot the published site.
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: website/package-lock.json

    - name: Build website
      working-directory: website
      run: |
        npm ci
        npm run build

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install clang-format
      run: sudo apt-get install -y clang-format

    - name: Check formatting
      run: |
        find src -name "*.cpp" -o -name "*.hpp" | xargs clang-format --dry-run --Werror
      continue-on-error: true

  android-build:
    # Termux target. term-ime is a TUI program built on forkpty/termios, so
    # this job exists to prove the CROSS-COMPILE keeps working: the Android
    # binary must configure, compile and link without a device in the loop.
    #
    # What this does NOT cover: running it under Termux. PTY, TIOCGWINSZ and
    # SIGWINCH behaviour on a real phone is unverified here, so read this as
    # "still builds for arm64 Android", not "works on a phone".
    # API 28 is the floor: bionic only gained posix_spawn (libuv's process.c
    # needs it) at API 28.
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install NDK
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build
        # r27 is what this was developed against; a newer r28+ should also work.
        # The zip's top-level dir is `android-ndk-r27` (NO version suffix), so
        # do not assume a directory name -- discover it from the toolchain file.
        # --http1.1: dl.google.com resets the HTTP/2 stream on this 664MB body.
        curl -fsSL --http1.1 -o /tmp/ndk.zip \
          "https://dl.google.com/android/repository/android-ndk-r27-linux.zip"
        sudo unzip -q /tmp/ndk.zip -d /opt/ndk
        # GitHub runners already export ANDROID_NDK_ROOT for their own NDK;
        # appending to it would produce a path that does not exist.
        # <ndk>/build/cmake/android.toolchain.cmake -> three dirnames back up.
        NDK="$(find /opt/ndk -name android.toolchain.cmake -path '*/build/cmake/*' -print -quit \
              | xargs dirname | xargs dirname | xargs dirname)"
        test -f "${NDK}/build/cmake/android.toolchain.cmake" \
          || { echo "could not locate an NDK toolchain under /opt/ndk (got '${NDK}')"; exit 1; }
        echo "ANDROID_NDK=${NDK}" >> "$GITHUB_ENV"

    - name: Cross-compile for arm64-v8a (API 28)
      run: |
        cmake -B build-android -G Ninja \
          -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK}/build/cmake/android.toolchain.cmake" \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-28 \
          -DCMAKE_BUILD_TYPE=Release
        cmake --build build-android -j$(nproc) --target term-ime

    - name: Verify the Android binary
      run: |
        BIN=build-android/term-ime
        BINUTILS="${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin"
        test -x "$BIN" || { echo "no binary produced"; exit 1; }
        file "$BIN"
        # Must be an ARM64 Android ELF using the platform loader...
        file "$BIN" | grep -q "ARM aarch64" || { echo "not aarch64"; exit 1; }
        file "$BIN" | grep -q "/system/bin/linker64" || { echo "not an Android binary"; exit 1; }
        # ...and must NOT be static: a -static bionic link is not loadable by
        # Android, which is exactly the regression worth failing on.
        if file "$BIN" | grep -q "statically linked"; then
          echo "ERROR: Android binary is statically linked; the platform loader rejects that"
          exit 1
        fi
        # Only platform libraries may be needed -- no glibc, no host leftovers.
        "${BINUTILS}/llvm-readelf" -d "$BIN" | grep NEEDED
        readelf -d "$BIN" | grep NEEDED | sed 's/.*\[\(.*\)\]/\1/' | while read -r lib; do
          case "$lib" in
            libc.so|libm.so|libdl.so|liblog.so) ;;
            *) echo "ERROR: unexpected runtime dep: $lib"; exit 1 ;;
          esac
        done
        # forkpty is what makes a TUI-in-a-PTY possible on Android at all.
        "${BINUTILS}/llvm-nm" -D "$BIN" | grep -q "forkpty@LIBC" \
          || { echo "ERROR: forkpty not bound against bionic's libc"; exit 1; }
        echo "OK: aarch64 Android binary, platform libs only, forkpty resolved"

  install-test:
    # End-to-end check of the one-line installer (curl | bash). Rebuilds the
    # release tarball locally (same layout as release.yml), serves it over a
    # throwaway HTTP server, then pipes it through website/static/install.sh
    # via TERM_IME_DOWNLOAD_BASE and asserts the installed `ti` binary works.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake pkg-config

    - name: Configure & build
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build --config Release -j$(nproc)

    - name: Pack release tarball (mirror release.yml)
      run: |
        mkdir -p dist/term-ime/bin
        mkdir -p dist/term-ime/share/term-ime/rime-data
        mkdir -p dist/term-ime/share/term-ime/translations
        cp build/term-ime dist/term-ime/bin/ti
        ln -sf ti dist/term-ime/bin/term-ime
        cp -r build/share/rime-data/* dist/term-ime/share/term-ime/rime-data/
        cp data/translations/*.json dist/term-ime/share/term-ime/translations/
        cp README.md dist/term-ime/
        tar -czf term-ime-linux-x86_64.tar.gz -C dist term-ime
        sha256sum term-ime-linux-x86_64.tar.gz > term-ime-linux-x86_64.tar.gz.sha256

    - name: Run installer and verify binary
      run: |
        set -euo pipefail
        python3 -m http.server 8899 --directory . >/tmp/httpserver.log 2>&1 &
        SERVER_PID=$!
        trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
        sleep 1

        PREFIX="$(mktemp -d)/ime"
        TERM_IME_DOWNLOAD_BASE="http://127.0.0.1:8899" \
          bash website/static/install.sh --version v9.9.9 --prefix "$PREFIX" \
          | tee /tmp/install.log
        grep -q "Installed rime-data" /tmp/install.log
        grep -q "Installed translations" /tmp/install.log

        test -x "$PREFIX/bin/ti"
        test -L "$PREFIX/bin/term-ime"
        test "$(readlink "$PREFIX/bin/term-ime")" = "ti"

        # The real TUI needs a PTY (already covered by the `e2e` job, which
        # drives the freshly-built binary). Here we assert the installer's
        # hand-off is sound: binary placed, alias symlinked, data installed,
        # statically linked, and the script is syntactically clean.
        bash -n website/static/install.sh
        file "$PREFIX/bin/ti" | grep -q "statically linked"
        test -s "$PREFIX/bin/term-ime"
        test -f "$PREFIX/share/term-ime/rime-data/essay.txt"
        test -f "$PREFIX/share/term-ime/translations/zh-CN.json"
        echo "OK: install-test passed"
