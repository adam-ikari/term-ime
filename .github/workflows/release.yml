name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system deps
        # Build deps/librime from source (submodule) needs Boost + friends.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            libuv1-dev \
            libboost-all-dev \
            libgflags-dev \
            libyaml-cpp-dev \
            libmarisa-dev \
            libopencc-dev \
            libleveldb-dev \
            libprotobuf-dev \
            protobuf-compiler

      - name: Configure & build (Release)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)

      - name: Sanity-check the binary
        run: |
          file build/term-ime
          # Must exit cleanly when stdin is not a TTY (graceful non-TTY exit).
          ./build/term-ime < /dev/null || true

      - name: Pack artifact
        run: |
          mkdir -p dist/term-ime
          cp build/term-ime dist/term-ime/
          cp README.md CLAUDE.md dist/term-ime/ 2>/dev/null || true
          tar -czf term-ime-linux-x86_64.tar.gz -C dist term-ime
          sha256sum term-ime-linux-x86_64.tar.gz > term-ime-linux-x86_64.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: term-ime-linux-x86_64
          path: |
            term-ime-linux-x86_64.tar.gz
            term-ime-linux-x86_64.tar.gz.sha256

  release:
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: term-ime-linux-x86_64
          path: dist

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/term-ime-linux-x86_64.tar.gz
            dist/term-ime-linux-x86_64.tar.gz.sha256
          generate_release_notes: true
          draft: true
