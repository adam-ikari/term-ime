name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            # GitHub-provided free ARM64 runner for public repos.
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config

      - name: Configure & build (Release)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXE_LINKER_FLAGS="-static -static-libgcc -static-libstdc++" \
            -DBUILD_SHARED_LIBS=OFF
          cmake --build build -j$(nproc)

      - name: Verify static linking
        run: |
          echo ">> Checking binary dependencies..."
          file build/term-ime
          echo ">> Dynamic dependencies:"
          ldd build/term-ime || true
          echo ">> Checking for boost symbols:"
          nm build/term-ime 2>/dev/null | grep -i "boost.*regex" | head -5 || echo "No boost regex symbols"
          if ldd build/term-ime 2>&1 | grep -qE '=> /'; then
            echo "ERROR: binary has dynamic deps:"; ldd build/term-ime; exit 1
          fi
          echo "OK: fully static, zero runtime deps"

      - name: Pack artifact (binary + rime-data + translations)
        run: |
          mkdir -p dist/term-ime/bin
          mkdir -p dist/term-ime/share/term-ime/rime-data
          mkdir -p dist/term-ime/share/term-ime/translations
          # 主命令名是短命令 `ti`（terminal input）；`term-ime` 作为兼容别名符号链接。
          cp build/term-ime dist/term-ime/bin/ti
          ln -sf ti dist/term-ime/bin/term-ime
          cp -r build/share/rime-data/* dist/term-ime/share/term-ime/rime-data/
          cp data/translations/*.json dist/term-ime/share/term-ime/translations/
          cp README.md dist/term-ime/
          tar -czf term-ime-linux-${{ matrix.arch }}.tar.gz -C dist term-ime
          sha256sum term-ime-linux-${{ matrix.arch }}.tar.gz > term-ime-linux-${{ matrix.arch }}.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: term-ime-linux-${{ matrix.arch }}
          path: |
            term-ime-linux-${{ matrix.arch }}.tar.gz
            term-ime-linux-${{ matrix.arch }}.tar.gz.sha256

  build-android:
    # Termux / Android arm64 artifact.
    #
    # This is EXPERIMENTAL. The binary is not statically linked (bionic has no
    # static libc; see CMakeLists), and nobody has run it on a real phone yet --
    # the PTY/raw-mode/SIGWINCH behaviour under Termux is unverified. It ships
    # under an `-termux` suffixed name and is NOT wired into install.sh, so the
    # stable glibc one-liner is unaffected.
    #
    # API 28 is the floor: libuv's process.c needs posix_spawn, which bionic only
    # gained at API 28 (Android 9).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install NDK
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
          # The zip's top-level dir is `android-ndk-r27` (no version suffix), so
          # discover it rather than assuming. --http1.1 because dl.google.com
          # resets the HTTP/2 stream on this 664MB body.
          curl -fsSL --http1.1 -o /tmp/ndk.zip \
            "https://dl.google.com/android/repository/android-ndk-r27-linux.zip"
          sudo unzip -q /tmp/ndk.zip -d /opt/ndk
          # GitHub runners already export ANDROID_NDK_ROOT for their own NDK;
          # appending to it would produce a path that does not exist.
          # <ndk>/build/cmake/android.toolchain.cmake -> three dirnames back up.
          NDK="$(find /opt/ndk -name android.toolchain.cmake -path '*/build/cmake/*' -print -quit \
                | xargs dirname | xargs dirname | xargs dirname)"
          test -f "${NDK}/build/cmake/android.toolchain.cmake" \
            || { echo "could not locate an NDK toolchain under /opt/ndk (got '${NDK}')"; exit 1; }
          echo "ANDROID_NDK=${NDK}" >> "$GITHUB_ENV"

      - name: Cross-compile for arm64-v8a (API 28)
        run: |
          cmake -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-android -j$(nproc) --target term-ime
          # Strip: the NDK build carries debug info and would ship ~14x larger.
          "${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" \
            build-android/term-ime

      - name: Verify the Android binary
        run: |
          BIN=build-android/term-ime
          BINUTILS="${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$BIN" || { echo "no binary produced"; exit 1; }
          file "$BIN"
          file "$BIN" | grep -q "ARM aarch64" || { echo "not aarch64"; exit 1; }
          file "$BIN" | grep -q "/system/bin/linker64" || { echo "not an Android binary"; exit 1; }
          # A -static bionic link is not loadable by Android; that would be the
          # one regression worth failing this job over.
          if file "$BIN" | grep -q "statically linked"; then
            echo "ERROR: statically linked, which the Android loader rejects"; exit 1
          fi
          # Only platform libraries may be needed.
          readelf -d "$BIN" | grep NEEDED | sed 's/.*\[\(.*\)\]/\1/' | while read -r lib; do
            case "$lib" in
              libc.so|libm.so|libdl.so|liblog.so) ;;
              *) echo "ERROR: unexpected runtime dep: $lib"; exit 1 ;;
            esac
          done
          "${BINUTILS}/llvm-nm" -D "$BIN" | grep -q "forkpty@LIBC" \
            || { echo "ERROR: forkpty not bound against bionic's libc"; exit 1; }
          echo "OK: aarch64 Android binary, platform libs only, forkpty resolved"

      - name: Pack artifact (binary + rime-data + translations)
        run: |
          mkdir -p dist/term-ime/bin
          mkdir -p dist/term-ime/share/term-ime/rime-data
          mkdir -p dist/term-ime/share/term-ime/translations
          cp build-android/term-ime dist/term-ime/bin/ti
          cp -r build-android/share/rime-data/* dist/term-ime/share/term-ime/rime-data/
          cp data/translations/*.json dist/term-ime/share/term-ime/translations/
          cp README.md dist/term-ime/
          # `-termux` in the name so nobody mistakes this for the glibc build,
          # and so install.sh's asset glob (term-ime-linux-*) can't pick it up.
          tar -czf term-ime-termux-arm64.tar.gz -C dist term-ime
          sha256sum term-ime-termux-arm64.tar.gz > term-ime-termux-arm64.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: term-ime-termux-arm64
          path: |
            term-ime-termux-arm64.tar.gz
            term-ime-termux-arm64.tar.gz.sha256

  release:
    needs: [build-linux, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          # No `name:` → downloads every artifact into dist/<artifact-name>/
          # (linux x86_64 + linux aarch64 + termux arm64).

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*/term-ime-linux-*.tar.gz
            dist/*/term-ime-linux-*.tar.gz.sha256
            dist/*/term-ime-termux-*.tar.gz
            dist/*/term-ime-termux-*.tar.gz.sha256
            website/static/install.sh
          generate_release_notes: true
          draft: false
          # Termux builds for Android arm64 and has never run on a device, so
          # it must not be what `install.sh`'s "latest release" resolves to --
          # that would hand phones a binary nothing has verified. Publishing
          # Termux-only tags as prereleases keeps them out of /releases/latest.
          prerelease: ${{ startsWith(github.ref, 'refs/tags/v1.1.7-termux') }}
