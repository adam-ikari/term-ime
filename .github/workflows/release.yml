name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config

      - name: Configure & build (Release)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXE_LINKER_FLAGS="-static -static-libgcc -static-libstdc++" \
            -DBUILD_SHARED_LIBS=OFF
          cmake --build build -j$(nproc)

      - name: Verify static linking
        run: |
          echo ">> Checking binary dependencies..."
          file build/term-ime
          echo ">> Dynamic dependencies:"
          ldd build/term-ime || true
          echo ">> Checking for boost symbols:"
          nm build/term-ime 2>/dev/null | grep -i "boost.*regex" | head -5 || echo "No boost regex symbols"
          if ldd build/term-ime 2>&1 | grep -qE '=> /'; then
            echo "ERROR: binary has dynamic deps:"; ldd build/term-ime; exit 1
          fi
          echo "OK: fully static, zero runtime deps"

      - name: Pack artifact (binary + rime-data)
        run: |
          mkdir -p dist/term-ime/bin
          mkdir -p dist/term-ime/share/term-ime/rime-data
          cp build/term-ime dist/term-ime/bin/
          cp -r build/share/rime-data/* dist/term-ime/share/term-ime/rime-data/
          cp README.md dist/term-ime/
          tar -czf term-ime-linux-x86_64.tar.gz -C dist term-ime
          sha256sum term-ime-linux-x86_64.tar.gz > term-ime-linux-x86_64.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: term-ime-linux-x86_64
          path: |
            term-ime-linux-x86_64.tar.gz
            term-ime-linux-x86_64.tar.gz.sha256

  release:
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: term-ime-linux-x86_64
          path: dist

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/term-ime-linux-x86_64.tar.gz
            dist/term-ime-linux-x86_64.tar.gz.sha256
            website/public/install.sh
          generate_release_notes: true
          draft: false
