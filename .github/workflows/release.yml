name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config
      # yaml-cpp/leveldb/marisa/opencc build from vendored source
      # (deps/librime/deps/*) as static archives — no system -dev needed.
      # Boost is fully removed (librime uses std::regex + <rime/*.hpp> shims;
      # boost/sml.hpp comes from the bundled deps/sml submodule). The binary
      # links fully -static (zero runtime shared libs); see the ldd assertion below.

      - name: Configure & build (Release)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)

      - name: Sanity-check the binary
        run: |
          file build/term-ime
          ./build/term-ime < /dev/null || true
          # Assert the binary is fully statically linked (zero runtime shared
          # libs). ldd on a static binary prints "not a dynamic executable".
          if ldd build/term-ime 2>&1 | grep -qE '=> /'; then
            echo "ERROR: binary has dynamic deps:"; ldd build/term-ime; exit 1
          fi
          echo "OK: fully static, zero runtime deps"

      - name: Pack artifact
        run: |
          mkdir -p dist/term-ime
          cp build/term-ime dist/term-ime/
          cp README.md CLAUDE.md dist/term-ime/ 2>/dev/null || true
          tar -czf term-ime-linux-x86_64.tar.gz -C dist term-ime
          sha256sum term-ime-linux-x86_64.tar.gz > term-ime-linux-x86_64.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: term-ime-linux-x86_64
          path: |
            term-ime-linux-x86_64.tar.gz
            term-ime-linux-x86_64.tar.gz.sha256

  release:
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: term-ime-linux-x86_64
          path: dist

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/term-ime-linux-x86_64.tar.gz
            dist/term-ime-linux-x86_64.tar.gz.sha256
            website/public/install.sh
          generate_release_notes: true
          draft: true
