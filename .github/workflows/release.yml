name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            # GitHub-provided free ARM64 runner for public repos.
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config

      - name: Configure & build (Release)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXE_LINKER_FLAGS="-static -static-libgcc -static-libstdc++" \
            -DBUILD_SHARED_LIBS=OFF
          cmake --build build -j$(nproc)

      - name: Verify static linking
        run: |
          echo ">> Checking binary dependencies..."
          file build/term-ime
          echo ">> Dynamic dependencies:"
          ldd build/term-ime || true
          echo ">> Checking for boost symbols:"
          nm build/term-ime 2>/dev/null | grep -i "boost.*regex" | head -5 || echo "No boost regex symbols"
          if ldd build/term-ime 2>&1 | grep -qE '=> /'; then
            echo "ERROR: binary has dynamic deps:"; ldd build/term-ime; exit 1
          fi
          echo "OK: fully static, zero runtime deps"

      - name: Refresh LICENSES/ from vendored deps
        run: ./tools/collect-licenses.sh

      - name: Pack artifact (binary + rime-data + translations + licenses)
        run: |
          mkdir -p dist/term-ime/bin
          mkdir -p dist/term-ime/share/term-ime/rime-data
          mkdir -p dist/term-ime/share/term-ime/translations
          # 主命令名是短命令 `ti`（terminal input）；`term-ime` 作为兼容别名符号链接。
          cp build/term-ime dist/term-ime/bin/ti
          ln -sf ti dist/term-ime/bin/term-ime
          cp -r build/share/rime-data/* dist/term-ime/share/term-ime/rime-data/
          cp data/translations/*.json dist/term-ime/share/term-ime/translations/
          # 静态二进制内嵌多个第三方库，且 rime-data 含 LGPL-3.0 数据 ——
          # 重分发时必须随附版权声明与许可全文。
          cp LICENSE dist/term-ime/
          cp -r LICENSES dist/term-ime/
          cp README.md dist/term-ime/
          tar -czf term-ime-linux-${{ matrix.arch }}.tar.gz -C dist term-ime
          sha256sum term-ime-linux-${{ matrix.arch }}.tar.gz > term-ime-linux-${{ matrix.arch }}.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: term-ime-linux-${{ matrix.arch }}
          path: |
            term-ime-linux-${{ matrix.arch }}.tar.gz
            term-ime-linux-${{ matrix.arch }}.tar.gz.sha256

  tests:
    # The gate that was missing: release.yml used to build, pack and publish
    # without running a single test, while install.sh points at
    # /releases/latest -- so "untested" and "shipped to everyone" were the same
    # event. Runs the full suite the push workflow runs, once, on the same
    # Ubuntu version the released binary is built on.
    #
    # Costs a second build (jobs cannot share object files), and it covers
    # x86_64 only: the aarch64 artifact is still gated by build-linux's compile
    # and zero-dynamic-deps checks, not by these tests.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config

      - name: Configure & build (Release)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXE_LINKER_FLAGS="-static -static-libgcc -static-libstdc++" \
            -DBUILD_SHARED_LIBS=OFF
          cmake --build build -j$(nproc)

      - name: Unit tests
        run: cd build && ctest --output-on-failure

      - name: End-to-end tests
        run: ./tools/run-e2e.sh

  release:
    needs: [build-linux, tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          # No `name:` → downloads every artifact into dist/<artifact-name>/
          # (linux x86_64 + linux aarch64).

      # Publish the tag. Deliberately no prerelease logic: an untested build
      # must stay out of /releases/latest. If you add a platform whose binary
      # you cannot run, mark this release as a prerelease.
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*/term-ime-linux-*.tar.gz
            dist/*/term-ime-linux-*.tar.gz.sha256
            website/static/install.sh
          generate_release_notes: true
          draft: false
