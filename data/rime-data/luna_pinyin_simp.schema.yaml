# Rime schema
# encoding: utf-8

__include: luna_pinyin.schema:/

# 默认启用简化字
__patch:
  - patches/@0/switches/@2/reset: 1
  - luna_pinyin_simp.custom:/patch?

schema:
  schema_id: luna_pinyin_simp
  name: 朙月拼音·简化字
  version: "0.31"
  description: |
    朙月拼音，简化字输出模式。
    使用 luna_pinyin 词典 + OpenCC 简化字转换。

# 不覆盖 switches，使用父 schema 的繁简切换选项
# 通过 __patch 默认启用 zh_hans

translator:
  dictionary: luna_pinyin
  prism: luna_pinyin_simp
  preedit_format:
    - xform/([nl])v/$1ü/
    - xform/([nl])ue/$1üe/
    - xform/([jqxy])v/$1u/